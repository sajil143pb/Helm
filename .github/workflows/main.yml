name: Release Helm Chart

on:
  push:
    paths:
      - 'charts/**'   # run only when chart files change
    branches:
      - main          # or your default branch

permissions:
  contents: write     # required to push to gh-pages branch

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for index.yaml merge

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package Helm chart
        run: |
          mkdir -p packaged
          helm package charts/* --destination packaged

      - name: Update Helm repo index
        run: |
          helm repo index packaged --url https://sajil143pb.github.io/Helm/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: packaged
          force_orphan: true
